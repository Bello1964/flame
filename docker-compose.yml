services:
  db:
    image: postgres:18
    container_name: carbon-accounting-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: carbon
      POSTGRES_PASSWORD: carbon_local_dev_only
      POSTGRES_DB: carbon_accounting
    ports:
      # 5434 avoids local PostgreSQL Windows services on 5432/5433 and
      # Hyper-V reserved port ranges. Bound to loopback only.
      - "127.0.0.1:5434:5432"
    volumes:
      - carbon_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbon -d carbon_accounting"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  carbon_pgdata:
