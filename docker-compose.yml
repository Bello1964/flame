name: flame

services:
  db:
    image: postgres:18
    container_name: flame-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: flame
      POSTGRES_PASSWORD: flame_local_dev_only
      POSTGRES_DB: flame
    ports:
      # 5434 avoids local PostgreSQL Windows services on 5432/5433 and
      # Hyper-V reserved port ranges. Bound to loopback only.
      - '127.0.0.1:5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flame -d flame']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
