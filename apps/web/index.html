<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171d1c" />
    <!-- Invitation and password reset pages carry a secret token in their URL: never send
         it on as a Referer, to the API or to any other site. -->
    <meta name="referrer" content="no-referrer" />
    <title>Flame</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23171d1c'/%3E%3Cpath d='M16 14v13M12 27h8' stroke='%23f2efe8' stroke-width='2.4'/%3E%3Cpath d='M16 3.5c-3.3 4-5.9 7-5.9 10.4a5.9 5.9 0 0 0 11.8 0c0-3.4-2.6-6.4-5.9-10.4z' fill='%23d9826b'/%3E%3Ccircle cx='16' cy='14.4' r='2.4' fill='%23d5a84f'/%3E%3C/svg%3E"
    />
    <style>
      /*
       * Shown from the first byte until the app's code has loaded and React replaces it,
       * so slow connections see the brand, not a blank page. Static: no animation.
       */
      html,
      body {
        margin: 0;
        background: #f2efe8;
        color: #171d1c;
        font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
      }
      .boot {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.25rem;
        text-align: center;
        padding: 0 1rem;
      }
      .boot strong {
        font-size: 0.95rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        font-weight: 600;
      }
      .boot span {
        font-size: 0.8rem;
        color: #5b6661;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status">
        <strong>Flame</strong>
        <span>Loading…</span>
      </div>
    </div>
    <noscript>
      <p class="boot">Flame needs JavaScript. Enable it in your browser to continue.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
